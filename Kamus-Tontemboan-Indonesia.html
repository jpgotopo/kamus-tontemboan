cf": "", "k": "palabra", "m": "← Ἰουδαϊκός; Ἰουδαῖος-1; Ἰουδαῖος-2"}, {"t": "yairus", "i": "kepala rumah ibadat", "lv": "B", "cf": "", "k": "palabra", "m": "← ἀρχισυναγωγος"}, {"t": "yaku", "i": "aku", "lv": "C", "cf": "alta", "k": "palabra", "m": "korpus p0.95 n342"}, {"t": "yakuo", "i": "akulah", "lv": "C", "cf": "alta", "k": "palabra", "m": "korpus p0.96 n37"}, {"t": "yehuda", "i": "yehuda", "lv": "A", "cf": "", "k": "palabra", "m": "✓korpus p0.99 n246"}, {"t": "yéndo", "i": "matahari", "lv": "C", "cf": "alta", "k": "palabra", "m": "korpus p0.97 n42"}, {"t": "yerobeam", "i": "ahia; yerobeam", "lv": "A", "cf": "", "k": "palabra", "m": "✓korpus p0.98 n76"}, {"t": "yesus", "i": "yesus", "lv": "A", "cf": "", "k": "palabra", "m": ""}, {"t": "yusér", "i": "menegur; menghardik", "lv": "B", "cf": "", "k": "palabra", "m": "← ἐπιτιμάω; ἐπιτιμάω-1 · ✓korpus p0.84 n12"}, {"t": "yutus", "i": "diutus", "lv": "C", "cf": "media", "k": "palabra", "m": "korpus p0.87 n7"}, {"t": "zaitun", "i": "zaitun", "lv": "C", "cf": "alta", "k": "palabra", "m": "korpus p0.99 n14"}], "glos": [{"t": "Abar Kaaruien", "i": "Injil", "d": "A nunuwu' é Yunani euangelion , eng kaangéanna ‘Abar Kaaruien andumoro' i Yesus Kristus’. Si Yesus Kristus ituo si mai ang kayo'baan, maté wo tinou sumawel wosama' si séi e maéman ai Sia, eng kamesé-meséaanna ampungan oka wo makéré ing katouan akar ing kauré-uré mewali-wali wo si Casuruan."}, {"t": "Asia kuma'pa Asia Teké'", "i": "Asia atau Asia Kecil", "d": "Ang Kitap Le'nas awéan Asia wo awéan ka'i Asia Teké' taan en itu meputé. Wo Asia kuma'pa Asia Teké' ang Kitap Le'nas ra'ica meputé wo in Asia intarépé'. En sangkum itu tumuru' asi esa bagéan am benua Asia intarépé' si an tempok ako. Asi ta'un 129 an tutuw i Yesus ra'ipé' itumou, émaan é pemerénta Romawi en sangkum anio' mamuali esa propénsi, wo en ibu kotana Efesus. Intarépé' en sangkum anio' a negara Turki."}, {"t": "Ata", "i": "hamba", "d": "Tou si mengaéma' in tawoien kumiit si airu'du' i tuangna, sia ra'ica wana hak en sumundur si tuangna. Sa e nuwu' ‘ata’ pengapakén en sumelewir si Amang Kasuruan, eng kaangéanna musti wutu-wutul sumelewir, wo si maselewir itu ra'ica wana hak en sumundur taan musti émaanna si airu'du' i Amang Kasuruan ai sia."}, {"t": "Atoran-atoran ang kitap Torat", "i": "hukum Taurat", "d": "Sé lima kitap kataré an Taar Uré ipakua ‘Torat’ (kitap Kejadian, Keluaran, Imamat, Bilangan wo Ulangan). Ang kitap Torat itu keli en atoran, wosama' sé tou Israel menonou asaloke' kumiit ing kasalé'an i Amang Kasuruan. Sé sangapulu' ukum icauntep am bagéan asi atoran-atoran ang kitap Torat, wo keliané' ka'i atoran walina. En atoran-atoran ang kitap Torat itu pakua é tou ‘ukum i Musa’, ampa'paan kiit ing kanaramen, si Musa e matic sé lima kitap kataré an Taar Uré."}, {"t": "Endo wangko' Paska", "i": "hari raya Paskah", "d": "Sé tou Israel airu'du' i Amang Kasuruan méma' in endo wangko' Paska susur in ta'un. Em pata'néian im Paska ituo si endo in tuma'néi si Amang Kasuruan mekar sé apo-apo' éra asi tana' Mesir owo (Kel. 12:1-51). En endo wangko' Paska itu pengaémaan é tou Israel tumo'tol an jaman in Taar Uré akar i Yesus imai (Mat. 26:1-5; Luk. 2:41-42). En endo wangko' Paska é tou Israel itu ra'ica meputé wo in endo Paska si pengaémaan é tou Krésten intarépé'. En endo wangko' Paska é tou Krésten intarépé' en tuma'néi ing ketou sumawel i Yesus asi papaté."}, {"t": "Endo wangko' Pentakosta", "i": "hari raya Pentakosta", "d": "Em Pentakosta eng kaangéanna ‘lima ngapulu’. Endo wangko' Pentakosta, en itu endo kalima ngapulu' kumawusai in endo wangko' Paska. Asi endo wangko' Pentakosta, pakasa sé tou Yahudi mai imali'us ang kota Yerusalem eng kumua i makapulu'sama' a si Amang Kasuruan ampa'paan séra mupu'o ing gandum sé ayusew éra. Wo ang kitap Kisah Para Rasul, aisisil sapaoka aiwéé i Amang Kasuruan e Roh-Na tumena asi endo wangko' itu."}, {"t": "Endo wangko' Roti Ra'ica Rinagian", "i": "hari raya Roti Tidak Beragi", "d": "Indior, ru'du' i Amang Kasuruan sé apo-apo' é tou Yahudi wosama' méma' roti ra'ica rinagian, eng kanen éra ang kauré in endo wangko' Paska, en tuma'néi an tutuw si Amang Kasuruan mekar sé apo-apo' éra kumesot a Mesir owo. Esa duminggu eng kauréna nianggap éra en ragi itu aipeputé wo ing kamesé-meséaan, anaé ang kauré in esa duminggu itu e ragi tiya' é tou Israel wo kuman i roti si ra'ica rinagian."}, {"t": "Endo wangko' Terung Lalaina", "i": "hari raya Pondok Daun", "d": "Endo wangko' é tou Yahudi an tutuw éra tuma'néi sé apo-apo' éra an tana' kapayasan wo maento' an teru-terung en atepna niéma' an lala-lalaina owo."}, {"t": "Farisi", "i": "Farisi", "d": "Esa golongan asé tou Yahudi. Séra anio' matimboi wutul in ukum Torat si aicua i Musa, akar en atoran itu pengawe-ngawesan éra."}, {"t": "Firdaus", "i": "Firdaus", "d": "An Taar Uré, eng kaangéan in firdaus ‘uma’, wo en uma itu aiwéé i Amang Kasuruan a sé tou kataré an tutuw éra ra'ipé' méma' ing kamesé-meséaan. An Taar Weru, en tampa anio' tumuru' in sorga kuma'pa tampa é mu'kur sé maaru-arui."}, {"t": "Galilea", "i": "Galilea", "d": "Eng Galilea anio' an sangkum in a mongéna an Israel, tampa winangko'an i Apo' Yesus wo an tampa itu ka'i tino'tolan-Na maselewir. Sé tou am bitu awéan tou Yahudi wo tou ra'ica Yahudi."}, {"t": "Herodes", "i": "Herodes", "d": "Awéan lima tou e makangaran Herodes. Séra anio' sé makakawasa a sé tou Yahudi an tutuw é pemerénta Romawi makakawasa an Israel. Séra itu: 1. Kolano Herodes, sia si mamuali kolano an tutuw i Yesus itumou. Sia e rumu'du' patén waya sé toyaang tuama ruao ngata'un wo sé ra'ipé' malekep rua ngata'un ang kota Betlehem. 2. Herodes Arkhelaus, sia toyaang i colano Herodes. An tutuw si Yusuf, si Maria wo si Yesus maréngai an tana' Mesir owo, si Arkhelaus icaindé' i Yusuf ampa'paan sia itu toyaang i colano Herodes, ampa'paan in ituo séra in telu mangé mento' an sangkum ing Galilea wosama' séra menonou tayang ai isia 3. Herodes Antipas, sia anio' toyaang ka'i i colano Herodes. Sia gubernur si makakawasa an tutuw i Yesus makua in Abar Kaaruien akar si Yesus pinaté. Sia ka'i e maté si Yohanes Mabaptis. 4. Herodes Agripa I, sia anio' poyo' i colano Herodes. Sia si maté si Yakobus wo si merénta yuntep si Petrus am bui. 5. Herodes Agripa II, sia anio' toyaang i Herodes Agripa I. Sia en luminga im perkara i Paulus an tutuw i Paulus méla in owakna."}, {"t": "Hosana", "i": "Hosana", "d": "Nuwu' a nunuwu' é Ibrani eng kaangéanna ‘méé ing kalowiran’. En nuwu' itu makauré mamuali nuwu' rarayoan si pengapakén é tou Israel en sumiri' si Amang Kasuruan wo ka'i rumayo si Yesus an tutuw-Na muntep in Yerusalem."}, {"t": "Imam", "i": "imam", "d": "Si mengatawoi am Balé Le'nas en tawoien anio' penting keli an agama é Yahudi. Si esa wo si esa imam mindo bagéan tumawoi am Balé Le'nas. En tawoienna: susur in endo tumunu ing kamenyan, wo méé i raragés a si Amang Kasuruan, wo awéan ka'i tawoien walina. Si imam anio' e makawali sé tou a si Amang Kasuruan, anaé sia masombayang torona é tou walina ka'i. Pakasa sé imam asi taranak i Lewi owo si esaan suku asé esa ngapulu' rua suku é tou Israel."}, {"t": "Imam wangko'", "i": "Imam Besar", "d": "Si makaanu in tawoien si rumangka-rangka' an agama Yahudi. Sia si capala é kikiiten é imam wo ka'i capala é Mahkamah Agama Yahudi. En tawoien anio' wayake' in esa tou e makatimboi. En tawoienna, an esa ngata'un imakasa muntep ang Kamar Lume'na-le'nas am Balé Le'nas e makawali a si Amang Kasuruan e méé iraragés binatang pinokol a si Amang Kasuruan, wo awéan ka'i tawoien walina."}, {"t": "Kaéng pengakawu' am Balé Le'nas", "i": "tabir Bait Suci", "d": "Si kaéng pengakawu' anio' aiwérén am Balé Le'nas eng kumawu' ing kamar Lume'na-le'nas si tampa pengaaian i Amang Kasuruan. Wayake' si imam wangko' e ro'na muntep asi kamar Lume'na-le'nas itu makasake' an sanga ta'un. Anaé, an tutuw eng kaéng pengakawu' itu mawirang maperua, en itu méé tuus sapaoka ang kayo'baan anio' eng kamar Lume'na-le'nas itu ra'io mamuali tampa wuntulke' i Amang Kasuruan, taan tumo'tolai a si témpo itu si Casuruan an unero é tou imaéman ai Sia."}, {"t": "Kaisar", "i": "Kaisar", "d": "Kolano si makakawasa am pakasa in sangkum sé pakakawasaan ing kakolanoan Romawi. An tutuw é kikiiten é tou Yahudi sumidang si Paulus an dior i gubernur Festus, pinangilek i Paulus a si Kaisar Romawi e murus im perkarana."}, {"t": "Kakolanoan i Amang Kasuruan", "i": "kerajaan Allah, kerajaan sorga", "d": "En istilah anio' andumoro' i Amang Kasuruan kumawasa tanu Kolano, Sia merénta tanu Kolano an sorga wo ang kayo'baan. An tutuw i Yesus mai, si Amang Kasuruan kumawasao tanu Kolano wo an unertao. Ang Kitap Le'nas é Tontémboan anio' e nuwu' ‘Kakolanoan i Amang Kasuruan’ wo e nuwu' ‘Amang Kasuruan kumawasa tanu Kolano’ sé rua nuwu' itu pengapakén."}, {"t": "Kasuruan", "i": "Tuhan", "d": "An teks aseli nunuwu' é Yunani, Kurios. ‘Kurios’ ro'na tumuru' a si ‘Kasuruan’, wo ka'i tumuru' in ‘tou’ sa isaléng ‘tuang’ tanumai: Kasuruan (Mat. 1:20), tuang (Mat. 10:25). ‘Kasuruan’ sa tumuru' a si Yesus isaléng a nunuwu' é Tontémboan ‘Apo Yesus’."}, {"t": "Kikiiten é imam", "i": "imam-imam kepala", "d": "Esa reru' é imam sé awéan pengaru wangko' an agama Yahudi. Séra sé mapimpin a Mahkamah Agama Yahudi. Séra itu ra'ica asé pamalé biasa, taan asé pamalé si aitantuo an Israel. Wo ai séra owo awéan en sinisir e mamuali imam wangko'."}, {"t": "Kikiiten é sétang", "i": "Iblis", "d": "Ang Kitap Le'nas keli en aipatic andumoro' i sétang. Taan kikiiten éra wayake' in esa, sia itu si pakua ‘kikiiten é sétang’."}, {"t": "Kitap Le'nas", "i": "Kitab Suci, tertulis, firman", "d": "En istilah anio' papakén an Taar Weru en tumuru' sé aipatic an Taar Uré."}, {"t": "Kristus", "i": "Kristus", "d": "‘Kristus’ a nunuwu' é Yunani eng kaangéanna ‘tou niurapi in solo’ en tawoienna aiwuntulke'. Eng kaangéanna a nunuwu' é Ibrani ‘Mesias’. An Taar Uré keli en tuus e matic andumoro' i Mesias si maai oka itu, taan an jaman i Yesus, ra'ipé' kailekan é tou si séi si maai oka itu. Awéan tou e makailek si Yesus itu si Mesias kuma'pa si Kristus, anaé makala'us teriman éra Sia, taan sé tou walina ra'ica. En ulitna si Yesus ituo si Kristus kuma'pa Mesias, si sinisir i Amang Kasuruan en lumowir sé tou."}, {"t": "Line'nas", "i": "dikuduskan", "d": "Si tou e maémano a si Yesus Kristus, niéma'o i Amang Kasuruan sia male'nas (Kis. 26:18; 1Kor. 1:2). Ang Kitap Le'nas aicua andumoro' i tou maéman musti le'nas ang karapi makailek wisa si loor wo wisa si ra'ica loor, en itu tanu si anio': ro'na menonow ang karapi in até weresi an dior i Amang Kasuruan (Rm. 6:19; 1Tes. 4:4)."}, {"t": "Lour Galilea", "i": "danau Galilea", "d": "Lour Galilea awéan piraan ngaran walina an Taar Weru: lour Genesaret (Luk. 5:1) wo lour Tiberias (Yoh. 6:1). Telu ngaran itu tumuru' asi esa lour si meputé."}, {"t": "Mahkamah Agama", "i": "Mahkamah Agama", "d": "Dewan é tou Yahudi si rumangka-rangka' an Israel. Sé tou am bitu sé imam kapala, sé makailek wutul in Torat wo sé matu'a é Yahudi. Eng kakeli éra 70 tou, wo si kikiiten éra itu si imam wangko'. Séra ka'i awéan kawasa e murus im perkara é tou wo in agama."}, {"t": "Makailek wutul", "i": "ahli", "d": "En istilah anio' tumuru' a sé tou sé makailek wutul andumoro' in sapake' mangé."}, {"t": "Makailek wutul in Torat", "i": "ahli Taurat", "d": "En istilah anio' tumuru' a sé tou ang golongan Yahudi sé makailek wutul ing kitap Torat, sé lima kitap kataré an Taar Uré. Séra mengasusui a sé tou Yahudi andumoro' im pakasa sé aipatic an Torat. Séra ka'i sé masina'u tumambisa mengapaké in Torat ang katouan é tou Yahudi mengendo-ngendo. Séra ka'i patowan en tumawang maakim in tou sé ra'ica makiit in Torat."}, {"t": "Maselewir", "i": "diaken, pelayan, hamba", "d": "E nuwu' anio' a nunuwu' é Yunani diakonos . Sa a nunuwu' é Tontémboan awéan piraan: 1. Sumelewir (Mat. 20:26); 2. Ata (Mat. 22:13; Flp. 1:1); 3. Sé tou maselewir (1Kor. 3:5)."}, {"t": "Matagi im pajak", "i": "pemungut cukai", "d": "An jaman i Yesus an sangkum in Israel, sé matagi im pajak itu tou Yahudi e matawoi a sé pemérénta Romawi. Séra matagi im pajak a sé tou mawangkér si pengawéé a sé pemerénta Romawi. Em pajak pengatagin éra lumébémai wo sé aitantuo é pemerénta Romawi. Sé matagi im pajak itu ra'ica icasalé' é tou Yahudi ampa'paan keli em pajak pengatagin éra em béé a sé pemerénta Romawi sé jumaja in sangkum éra."}, {"t": "Melkisedek", "i": "Melkisedek", "d": "Si Melkisedek anio' kolano an Salem owo. Eng kaangéan i ngaranna itu ‘kolano elur’. Sia anio' imam i Amang Kasuruan wo si méé ing kamang a si Abraham (Kej. 14:18-20). Si Yesus mamuali imam akar ing kauré-uré, puté wo si Melkisedek in dior si mamuali imam (Ibr. 5:6)."}, {"t": "Meresi in owak", "i": "penyucian diri", "d": "Sa sé tou Yahudi makaaié' an tampa é tou ra'ica Yahudi owo, sia musti méma' in upacara meresi in owak kumiit ing kanaramen éra tou Yahudi. Awéan ka'i andéan walina, sa si wéwéné werupé' makéré toyaang, si wéwéné Yahudi itu musti méma' in upacara meresi in owak kumiit ing kanaramen é tou Yahudi. En upacara itu eng kauréna esa duminggu."}, {"t": "Mesias", "i": "Mesias", "d": "Sérén eng ‘Kristus’."}, {"t": "Mur", "i": "mur", "d": "Tinanem si mawou manam pengapakén e méé in daragés, pengaémaan ubat wo ka'i pengapakén a mayat sa icubur."}, {"t": "Nabi", "i": "nabi", "d": "Sé tou winéan i Amang Kasuruan tawoien eng kumua in taar-Na a sé tou."}, {"t": "Nianggap wutul i Amang Kasuruan", "i": "dibenarkan", "d": "Sé tou ro'na mamuali wutul kuma'pa nianggap wutul i Amang Kasuruan ampa'paan maéman a si Yesus Kristus (Rm. 3:22; Gal. 2:16). Anaé, si tou maéman anio' teriman i Amang Kasuruan wo ra'ica makéré ukuman taan wéan-Na katouan akar ing kauré-uré. Si Yesus Kristus e muka in lalan anio', wo si séi si maéman, sia nianggap wutul an dior i Amang Kasuruan."}, {"t": "Nunuwu' é Aram", "i": "bahasa Aram", "d": "E nunuwu' anio' an jaman i Yesus, pengapakén é tou Yahudi susur in endo."}, {"t": "Nunuwu' é Ibrani", "i": "bahasa Ibrani", "d": "E nunuwu' anio' indior pengapakén é tou Israel. Kinelian sé aipatic an Taar Uré mengapaké i nunuwu' é Ibrani anio'. An tutuw é tou Israel imakala am perang, séra pinaali am Babel, a mangé mbitu séra mento' pitu ngapulu' ngata'un eng kauréna. Séra tumo'tolo maké i nunuwu' é Aram susur in endo wo makauré ipalupa érao e nunuwu' é Ibrani. An tutuw éra maréng an Israel, susur in endo séra tatap mengapaké i nunuwu' é Aram wo wayaoka im pira sé makailek i nunuwu' é Ibrani wo pengapakén éra oka sa séra matic in sastra."}, {"t": "Nunuwu' é Yunani", "i": "bahasa Yunani", "d": "E nunuwu' anio' tumo'tol kailekan é tou Israel an tutuw im penjajahan i Aleksander Agung, wo mamuali nunuwu' é pemerénta wo nunuwu' im paesaan é suku-suku. En Taar Weru si aseli aipatic maké inunuwu' anio'."}, {"t": "Nunuwu' i roh", "i": "bahasa roh", "d": "E nunuwu' i roh anio' esaan asé piraan kamang tatambér si aiwéé i Roh Le'nas. E nunuwu' roh itu pengapakén wosama' ro'na sumombayang e rumayo wo sumiri' si Amang Kasuruan."}, {"t": "Opo-opo'", "i": "berhala", "d": "Esaan sé pengapercayan é tou tanu kasuruan, kuma'pa paanggapena ro'na mamuali kasuruanna. Awéan si niéma' asi kayu owo, watu, tambaga, perak kuma'pa mas."}, {"t": "Papumpunan in anggor", "i": "kantong kulit", "d": "An jaman ing Kitap Le'nas, en anggor pengaéma' é tou am papumpunan in anggor si niéma' ang kulit i binatang owo. Ampa'paan sa en anggor weru pumpun éra am papumpunan weru, mandé en anggor itu sumepot, em papumpunan weru itu ra'ica makenta'. En andéan si aicua i Yesus itu, en sumusui sé tou Farisi sapaoka en sususuien weru i Yesus itu ra'ica toro kemun in sususuien uré éra."}, {"t": "Paragésan", "i": "mesbah", "d": "Tampa pengawetaan i raragés binatang pinokol si paragés é imam asi Amang Kasuruan. Modél in tampa itu tanu i méja."}, {"t": "Paska", "i": "Paskah", "d": "Sé tou Israel airu'du' i Amang Kasuruan méma' im pata'néian im Paska susur in ta'un. Em pata'néian im Paska ituo si endo in tuma'néi si Amang Kasuruan mekar sé apo-apo' éra asi tana' Mesir owo (Kel. 12:1-51). Em pata'néian itu pengaémaan é tou Israel tumo'tol an jaman in Taar Uré akar i Yesus imai (Mat. 26:1-5; Luk. 2:41-42). Em pata'néian im Paska itu ra'ica meputé wo im pata'néian im Paska si pengaémaan é tou Krésten intarépé'. Em pata'néian im Paska é tou Krésten intarépé', tuma'néi ing ketou sumawel i Yesus asi papaté, wo patuulen 'endo wangko' Paska'."}, {"t": "Penatua", "i": "penatua", "d": "Penatua anio' si tou en lébé matu'a mai kuma'pa si matu'ao wo maakin sé jamaat. En tawoienna maakin sé jamaat wo masusui in sususuien i Amang Kasuruan a sé jamaat."}, {"t": "Perwira", "i": "perwira", "d": "Perwira itu kikiiten asé sangaatus suraro ang kakolanoan Romawi si patuulen senturion ."}, {"t": "Petrus", "i": "Petrus", "d": "En ulitna e ngaran i Petrus itu ‘Simon’. An tutuw mamuali murit i Yesus, sia ningaranan-Na ‘Petrus’ wo patowan ka'i ‘Kefas’. ‘Petrus’ a nunuwu' é Yunani eng kaangéanna ‘watu’, taniitu ka'i ‘Kefas’ a nunuwu' é Aram eng kaangéanna ‘watu’. Sia mepoow wo si Andreas."}, {"t": "Pilatus", "i": "Pilatus", "d": "Si Pilatus anio' gubernur Romawi si makakawasa an sangkum in Yudea, Samaria, wo in Idumea. An tutuw i Yesus aiwali wo aisaru a sé pemerénta Romawi, a si témpo itu si Pilatus e makatimboi ing kakawasaan."}, {"t": "Piti im perjanjian", "i": "tabut perjanjian", "d": "Em piti perjanjian anio' niéma' ang kayu owo, wo linapisan i mas tulén. An untepna pinumpunan i roti manna si aipumpun an untep im belangan mas, awéan weka' i Harun si masééo, wo rua lempar watu pinatican in sangapulu' ukum. Asi piti itu ka'i em paaian i Amang Kasuruan e rumoma' a sé tou Israel andumoro' in Taar-Na wo im perénta-Na."}, {"t": "Rayo wo in siri'", "i": "kemuliaan", "d": "En istilah anio' tumuru' ing ‘kawangko'an i Amang Kasuruan wo ing kawasa-Na sé ra'io icakua’. Awéan ka'i pira-piraan istilah sé pinaké, sé memputéan eng kaangéanna: Wangko' (Mat. 16:27), Menéla-nélap (Luk. 9:31-32), Iparangka-rangka' (Yoh. 3:30)."}, {"t": "Roh Le'nas", "i": "Roh Kudus", "d": "E Roh Le'nas anio' awéan ka'i piraan ngaran: Roh i Amang Kasuruan (Rm. 8:9), Roh i Casuruan (Kis. 5:9), Roh i Yesus (Kis. 16:7), wo Roh i Toyaang i Amang Kasuruan (Gal. 4:6). E Roh Le'nas mengatawoi si tanu Mengaibor kuma'pa Mengatawang wo mengasusui si wutul andumoro' i Amang Kasuruan. Sia tatap mewali-wali wo sé tou maéman (Yoh. 14:16-17). Eng kawasa i Roh Le'nas iméma' sé tou ra'ica maindé kumua andumoro' si Yesus Kristus (Kis. 1:8) Sia ka'i si méma' cita makailek sapaoka kita toya-toyaang i Amang Kasuruan (Rm. 8:15-16)."}, {"t": "Roh léwo'", "i": "roh jahat", "d": "Kawasa-kawasa sé mengatawér in tou akar mengaéma' ing kamesé-meséaan kuma'pa ka'i ing sakitan."}, {"t": "Roit", "i": "uang", "d": "An Taar Weru, awéan piraan modél in doit si membalinaan em bééna: talenta, mina, dinar, dirham. A nunuwu' é Tontémboan, modél in doit si membalinaan itu aisaléng makéke' serapan wo awéan keterangan kolek wosama' kakailekan si wisa en doit em bééna teké' kuma'pa em bééna wangker."}, {"t": "Roma", "i": "Roma", "d": "Eng kota Roma anio' wawangkeran, wo ibu kota ing kakolanoan Romawi. Ang kota anio' awéan ka'i jamaat Krésten. Ra'ica si Paulus eng kataré kumua in Abar Kaaruien andumoro' i Yesus Kristus a sé tou Romawi akar séra maéman, taan sia matico in surat Roma en sumina'u sé jamaat am bitu."}, {"t": "Ruru'du'an", "i": "rasul", "d": "Eng kaangéanna ruru'du'an i Yesus. Sinisir-Na sé 12 murit, séra patuulen ‘ruru'du'an’. Airu'du'-Na séra e méma' in tawoien-Na (Mat. 10:1-2). Awéan ka'i tou walina si airu'du'-Na eng kumua in Abar Kaaruien, séra itu patuulen ka'i ‘ruru'du'an’ tanumai si Paulus (Rm. 11:13), si ayutus i Casuruan eng kumua in Abar Kaaruien a sé tou ra'ica Yahudi."}, {"t": "Sabat", "i": "Sabat", "d": "Endo ipaapo' wo ipaena' é tou Yahudi, si endo ra'ica toro tumawoi. Pengaémaan éra asi ari Sabtu."}, {"t": "Saduki", "i": "Saduki", "d": "Esa golongan asé tou Yahudi. Séra matimboi wutul in atoran-atoran ang kitap Torat, taan ra'ica teriman éra eng kanaramen wo en atoran-atoran sé pengakiiten é tou Farisi. Keli asé golongan Saduki anio' sé mamuali imam. Séra ka'i asé pamalé pengasiriin an Israel, wo keli ka'i sé mamuali anggota Mahkamah Agama. Séra itu sé matu'tul am Balé Le'nas, wo ra'ica mapercaya sa sé tou imatéo tumou sumawel."}, {"t": "Sé tou mengatilik sé jamaat", "i": "pengawas jemaat", "d": "Kikiiten an jamaat si maselewir wo maakin sé tou maémano a si Yesus."}, {"t": "Sétang", "i": "setan", "d": "Sétang ro'na kumawasa kuma'pa rumasuk sé tou. Ro'na émaanna ka'i sé tou méma' ing kamesé-meséaan kuma'pa' sumakit."}, {"t": "Sunat", "i": "sunat", "d": "Sé toyaang tuama é tou Yahudi pasunaten an tutuw waluo ngando itumou. En sunat itu tanu tuus im perjanjian i Amang Kasuruan wo sé tou Yahudi indior. En sunat ka'i e méma' sé tou Yahudi ra'ica meputé wo sé tou ra'ica Yahudi sé ra'ica mapercaya a si Amang Kasuruan. Taan em penting keli, sunat itu esa tuus sapaoka sé tou Yahudi itu tou i Amang Kasuruan. An Taar Weru, sé tou Krésten ra'ica Yahudi ra'ica linesé' in sunaten. Icua i Paulus, ampa'paano i Yesus Kristus si lumowir in tou, sé tou ra'io sangali sunaten e makéré ing kalowiran."}, {"t": "Taranak i Daud", "i": "Keturunan Daud", "d": "In dior si Amang Kasuruan jumanjio a si colano Daud, sa esaan asé taranakna mamuali oka kolano akar ing kauré-uré. Anaé an tutuw é tou Yahudi mengento-ngento' in janji i Amang Kasuruan itu, séra manaram makua si pengento-ngentoon éra itu, ‘taranak i colano Daud’. An tutuw i Yesus mai, keli en tou makailek sapaoka Sia itu si aijanjio i Amang Kasuruan, anaé siriin éra Sia an tutuw Sia muntep in Yerusalem wo patowan éra Sia, ‘taranak i colano Daud’."}, {"t": "Ténda paapo'an", "i": "Kemah Suci", "d": "Indior airu'du i Amang Kasuruan a si Musa, e méma' esa ténda an tutuw é tou Israel kumesot a Mesir. En ténda itu si paaian i Amang Kasuruan (Kel. 25:1-9; 40:33-34, 38). Awéan en orasna sé imam maéma' i raragés am bitu torona i Amang Kasuruan, wo awéan ka'i en orasna séra masombayang am bitu. Anaé en ténda itu tanu in tuus sapaoka si Amang Kasuruan an uner éra. An tutuw i Yesus mai ang kayo'baan en itu mawéé tuus sapaoka si Amang Kasuruan ka'i mayo an uner é tou-Na."}, {"t": "Tou ra'ica makiit ing kasalé'an i Amang Kasuruan", "i": "orang fasik", "d": "Si tou menonou tayang a si Amang Kasuruan, si mengéma-ngéma'ke' ing kamesé-meséaan wo pawerotenna sapaoka eng kamesé-meséaan si niéma'na itu ra'io meséa' wo susa keli itiya'."}, {"t": "Tou ra'ica Yahudi", "i": "bangsa bukan Yahudi, orang bukan Yahudi", "d": "Sé suku kuma'pa etnis sé ra'ica Yahudi. Si Paulus ayutus i Amang Kasuruan e mangé kumua in Abar Kaaruien andumoro' i Yesus Kristus a sé tou ra'ica Yahudi wosama' séra ka'i ro'na maéman wo malowir."}, {"t": "Tou Romawi", "i": "warga negara Roma", "d": "Eng kakolanoan Romawi wawangkeran, taniitu ka'i em pengaruna. Ampa'paan in ituo keli en tou sé ra'ica tou Romawi masalé' in daftaren mamuali tou Romawi. An tutuw itu, sé pemerénta é Romawi ro'na mangkai tou mamuali tou Romawi sa si tou itu méma' sapake' mangé sé loor a sé pemerénta Romawi (Kis. 22:28a). Sé uréo mamuali tou Romawi, séra ka'i ro'na méé in hak éra a sé toya-toyaang éra (Kis. 22:28b). Sé tou Romawi kuma'pa mamualio tou Romawi ra'ica toro makéré ukuman in samboken, sa em perkarana ra'ipé sinidang (Kis. 22:25-29), lébé-lébépé' ka'i sa makéré ukuman patén. Séra ka'i awéan hak meta'up wo si colano si rumangka-rangka' ang kakolanoan Romawi e mekiupus sapaoka sapa si pinusé'o i akim an sidang si marapitke' (Kis. 25:10-12)."}, {"t": "Tou Samaria", "i": "orang Samaria", "d": "In dior sé sangapulu' suku Israel maénto' an sangkum in Israel a mongéna, séra itu ipakua ‘tou Samaria’. Awéan ka'i rua suku tou Israel sé maento' an sangkum Israel a mékona, séra itu ipakua ‘tou Yahudi’. Sé rua reru' anio' ra'ica mengkakiitan. Sé tou Samaria paanggapen é tou Yahudi ra'ica wutul makiit si Amang Kasuruan wo in atoran-atoran-Na. Sé tou Samaria ka'i mengkawéngano wo sé tou sé imai a Mesopotamia wo sé an Siria owo, wo sé tou Samaria paanggapen é tou Yahudi manajiso, anaé ra'ica kiim éra mekarapi wo sé tou Samaria."}, {"t": "Tou Yahudi", "i": "orang Yahudi", "d": "Sé tou Yahudi sinisiro i Amang Kasuruan indioré' owo. Asi kataré-taré séra ipakua ‘tou Ibrani’, makauré ipakua ‘tou Israel’, wo an jaman i Yesus ipakua ‘tou Yahudi’. E ngara-ngaran itu pengapakén asi suku kuma'pa etnis sé meputé, si tumuru' in suku kuma'pa etnis i Yesus Kristus. Sé tou Yahudi itu ka'i eng kumataré sinisir i Amang Kasuruan en tinokéan in taar-Na (Rm. 3:2)."}, {"t": "Toyaang i Amang Kasuruan", "i": "Anak Allah", "d": "Eng kaangéanna, si Yesus Kristus itu asi Amang Kasuruan owo kuma'pa puté wo si Amang Kasuruan (Yoh. 5:18). Yesus itu mamuali tou ra'ica tanu ing kanaramen, taan si Yesus mamuali tou ang karapi ing kawasa i Roh Le'nas wo i Amang Kasuruan (Luk. 1:35). Yesus itu si Amang Kasuruan si maio ang kayo'baan (Yoh. 1:14). Si kikiiten é tou Yahudi wo ka'i si gubernur Pilatus mamuéi a si Yesus, sa Sia itu Toyaang i Amang Kasuruan kuma'pa ra'ica, ampa'paan kiit iséra, si Amang Kasuruan ra'ica kawisa tumumpa mai a mangé sorga owo e mamuali tou (Mat. 26:63)."}, {"t": "Toyaang i Tou", "i": "Anak Manusia", "d": "En istilah anio' pinaké i Yesus tumuru' in owak-Na in esa. En istilah anio' niindo-Na ang kitap Dan. 7:13-14. Pinaké-Na en istilah anio' en sumisil sa Sia itu en lumowir sé tou meputé en aicua i nabi Daniel indior. Eng kaangéan in istilah anio' ra'icake' 'si Yesus itu tou', taan pinaké-Na en istilah anio' tutuw niampungan-Na eng kamesé-meséaan é tou, wo ka'i asi endo kaka'puan ing kayo'baan an tutuw Sia maai sumawel."}, {"t": "Toyaang-Ku", "i": "anak-Ku", "d": "Makapira pengapakén i Yesus e nunuwu' anio' a sé tou wangkoo kuma'pa a sé murit-Na, em basa-Na en tumowa ang karapi in upus si tou itu. Si Paulus ka'i maké i nuwu' ‘toyaang’ a si Timotius, wo si Yohanes ka'i maké i nuwu' ‘toyaang’ a sé tou an jamaat sé tumerima in surat-suratna."}, {"t": "Upus aitambér", "i": "anugerah, kasih karunia", "d": "Si Amang Kasuruan tumuru' in upus-Na a sé tou, mandé ka'i sé tou ra'ica makawoo méé in sapake' mangé en tumerima in upus-Na. Ampa'paan pakasa en itu asalo aitambér-Na. Wo ka'i ampa'paan in upus aitambér-Na itu, akar sé tou maéman ai Sia makéré ing kalowiran torona menonou akar ing kauré-uré."}, {"t": "Walé Le'nas", "i": "Bait Allah", "d": "Walé Le'nas itu esa kompleks si wawangkeran, (en ukuranna wona' 446m x 296m), wo an tampa itu ka'i mamuali pusat kegiatan agama Yahudi. Walé Le'nas ang Kitap Le'nas wayake' in esa, en tampana an Yerusalem. Wo si kataré-taré e mangun im Balé Le'nas itu si kolano Salomo, winangunna en itu maatus ngata'un an tutuw i Yesus ra'ipé mai. An jaman i Yesus, em Balé Le'nas itu winutul i colano Herodes eng kauréna 46 ngata'un (Yoh. 2:20). Am Balé Le'nas itu awéan bagéan-bagéan: awéan kamar le'nas, awéan kamar Lume'na-le'nas (Luk. 23:45), wo ka'i awéan kintal wangker si ang kesot ing gedung si tampa wuntulke' é tou Yahudi wo ka'i wuntulke' é tou ra'ica Yahudi. Em Balé Le'nas itu lini'cir im pager mésel rangka' wo wangker keli, wo awéan piraan papalen wangko'."}, {"t": "Walé paapo'an é agama Yahudi", "i": "rumah ibadat", "d": "Walé paapo'an anio' awéan an doong wo awéan ang kota, tampa pengali'usan é tou makaagama Yahudi wosama' ro'na pengasombayangan wo pengasusuian ing Kitap Le'nas."}, {"t": "Zelot", "i": "zelot", "d": "Ngaran i esa reru' si rumaméji mekar sé tou Israel asi kakawasaan ing kakolanoan Romawi."}], "prop": [{"t": "Abadon", "ty": "lain", "id": "Abadon (malaikat jurang maut)"}, {"t": "abel", "ty": "korpus", "id": ""}, {"t": "Abi", "ty": "orang", "id": ""}, {"t": "Abia", "ty": "orang", "id": ""}, {"t": "abiam", "ty": "korpus", "id": ""}, {"t": "abiezer", "ty": "korpus", "id": ""}, {"t": "abigail", "ty": "korpus", "id": ""}, {"t": "Abihud", "ty": "orang", "id": ""}, {"t": "Abilene", "ty": "tempat", "id": ""}, {"t": "abimelekh", "ty": "korpus", "id": ""}, {"t": "abisai", "ty": "korpus", "id": ""}, {"t": "abner", "ty": "korpus", "id": ""}, {"t": "Abraham", "ty": "orang", "id": ""}, {"t": "abraham", "ty": " function T(key,vars){let s=UI[key]||key;for(const k in (vars||{}))s=s.split("{"+k+"}").join(vars[k]);return s;}
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/['’-]/g,"");}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function hi(s,term){s=esc(s);if(!term)return s;try{const re=new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");return s.replace(re,"<mark>$1</mark>");}catch(e){return s;}}
function render(){
  const raw=q.value.trim(),term=norm(raw);let html="",shown=0,total=0;
  if(section==="main"){
    let rows=DATA.main.filter(r=>levels[r.lv]&&kinds[r.k]);total=rows.length;
    rows=rows.filter(r=>!term||norm(r.t).includes(term)||norm(r.i).includes(term));shown=rows.length;
    html=rows.map(r=>`<div class="entry"><div class="head"><span class="tw">${hi(r.t,raw)}</span>

    stat.innerHTML=T("stat_main",{shown:shown,total:total,all:DATA.counts.main,A:DATA.counts.A,B:DATA.counts.B});

    html=`<div class="entry"><table><thead><tr><th>${UI.col_source}</th><th>${UI.col_type}</th><th>${UI.col_gloss}</th></tr></thead><tbody>`+

    let mr=DATA.morf.filter(m=>!term||norm(m.join(" ")).includes(term));shown=mr.length;

    stat.innerHTML=T("stat_morf",{shown:shown});
  }
  list.innerHTML=html||`<div class="empty">${T("no_results",{q:esc(raw)})}</div>`;
}
